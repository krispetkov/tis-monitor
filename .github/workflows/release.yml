name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o tismonitor .

      - name: Package
        run: zip tismonitor-${{ github.ref_name }}-arm64.zip tismonitor README.md LICENSE

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: tismonitor-${{ github.ref_name }}-arm64.zip
          generate_release_notes: true
